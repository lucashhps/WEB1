<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Quebra-datas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Quebra-datas</h2>

  <label for="valores">Digite o valor:</label><br>
  <input type="text" id="valores">
  <button onclick="quebrarDatas()">Quebrar</button><br>

  <div id="resultado"></div>

  <script>
        function quebrarDatas() {
            let valores = document.getElementById('valores').value;
            let partes = valores.split("/");

            if (partes.length === 3) {
                let dia = partes[0].length === 4 ? partes[2] : partes[0];
                let mes = partes[1];
                let ano = partes[0].length === 4 ? partes[0] : partes[2];

                document.write("Dia: " + dia + "<br>Mês: " + mes + "<br>Ano: " + ano);
            } else {
                document.write("Formato de data inválido!");
            }
            }
  </script>
</body>
</html>
