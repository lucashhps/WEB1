<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Soma múltiplos de 3 ímpares</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Soma múltiplos de 3 ímpares</h2>

  <label for="entrada">Digite o valor:</label><br>
  <input type="text" id="entrada">
  <button onclick="somaMultiplos()">Somar</button><br>

  <div id="resultado"></div>

  <script>
        function somaMultiplos() {
            let entrada = document.getElementById('entrada').value;
            let numeros = entrada.split(',').map(Number);
            let soma = 0;

            for (let i = 0; i < numeros.length; i++) {
                let num = numeros[i];
                if (num % 2 !== 0 && num % 3 === 0) {
                soma += num;
                }
            }

            document.write("Soma: " + soma)
            }
  </script>
</body>
</html>
