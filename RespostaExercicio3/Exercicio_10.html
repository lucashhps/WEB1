<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Inverte lista</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Inverte lista</h2>

  <label for="entrada">Insira os valores</label><br>
  <input type="text" id="entrada">
  <button onclick="processar()">Inverter</button><br>

  <div id="resultado"></div>

  <script>
    
    function inverteListaInPlace(lista){
        let aux;
        for(let i = 0; i < Math.floor(lista.length/2); i++){
            aux = lista[lista.length - 1 - i];
            lista[lista.length - 1 - i] = lista[i];
            lista[i] = aux;
        }
    }

    function processar() {
        let entrada = document.getElementById('entrada').value;
        let numeros = entrada.split(',').map(Number);
        inverteListaInPlace(numeros);

        document.getElementById('resultado').innerHTML = numeros.join(", ") + "<br>";
    }
  </script>
</body>
</html>
